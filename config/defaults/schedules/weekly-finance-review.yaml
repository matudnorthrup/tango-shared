id: weekly-finance-review
display_name: Finance Review (Rolling)
description: >
  Sunday rolling finance review using the unified finance_review workflow:
  data freshness, transaction backlog, budget pace, reimbursements, and sinking
  fund contribution/draw status.
enabled: true
runtime: v2

obsidian_log:
  domain: Finance
  job_name: Finance Review

state_tracking:
  enabled: true
  domain: finance
  cadence: weekly
  verification: none
  review_checklist: finance

schedule:
  cron: "0 7 * * 0"
  timezone: America/Los_Angeles

execution:
  mode: agent
  deterministic_agent_id: foxtrot
  worker_id: personal-assistant
  intent_ids:
    - finance.budget_review
    - finance.sinking_fund_reconciliation
    - finance.transaction_lookup
  task: |
    Run a Finance Review for the Foxtrot finance thread.

    Review parameters:
    - review_phase: rolling
    - dry_run: false
    - review_window: current month-to-date
    - lookback_window: since the most recent review note

    IMPORTANT: Confirm today's date before doing any date math.

    Follow the unified finance_review skill guidance in
    agents/skills/finance-review.md. Weekly review is the rolling phase of the
    same process, not a separate workflow.

    The scheduler has already initialized this period's `finance-review` state
    entity. Query it before Step 1 and record each of the seven evidence-backed
    checkpoints exactly as the skill specifies. A prose summary is not a
    checkpoint, and you must not mark the overall review complete yourself.
    Update the one initialized entity with today's `review_date`,
    `last_execution_status: running`, and a non-null `schedule_run_id`. Never
    create another `finance-review` entity; stop as blocked if that lookup is
    not unique.

    Required behavior:
    1. Refresh stale Lunch Money/Plaid account data before judging missing
       transactions or sinking fund contributions. Use POST
       /plaid_accounts/fetch for stale relevant accounts, wait briefly, then
       re-query.
    2. Check job health, uncleared/uncategorized transaction backlog, receipt
       and reimbursement gaps, budget pace, rolling 30-day spending signals,
       sinking fund contributions, and sinking fund draw recommendations.
    3. For employer reimbursements, use receipt_registry structured
       actions first. Reconcile against live ExpenseDesk history before claiming an
       item is pending, unsubmitted, submitted, or reimbursed. Do not infer
       reimbursement amounts from Base views, old review notes, or note search.
    4. For sinking fund draws, classify recommendations as monitor/defer,
       optional, do now, or month-end true-up. Do not create or manage ExpenseDesk
       drafts. For the "do now" draws, call `bank_transfer` `plan` with one
       combined transfer per fund (memo = what it covers) and put the plan code
       and each transfer in the review note and summary with the line: reply
       `approve <code>` to send these. Never call `execute` from this job.
    5. When the profile-configured Kilo spending category or reserve is in
       scope, follow the private Kilo spending runbook: verify configured
       contribution timing once due, read `kilo_ledger summary` for the active
       bucket list, recommend active discretionary Kilo bucket draws for current
       transactions, wait for owner approval before `record_spend`, use
       `settle_spending` when the later bank/Lunch Money transfer out posts,
       use `record_historical_spend` only for old/context entries, and reconcile
       expected Kilo external balance against the configured backing account.
    6. Create or overwrite the review note at
       Records/Finance/Reviews/YYYY-MM-DD Finance Review.md.
       Use the finance_review frontmatter standard:
       types: [[Record]], areas: [[Finance]], record_kind: finance_review,
       review_phase: rolling, dry_run: false.
    7. Return a concise summary with review phase, data freshness, top flags,
       sinking fund recommendation summary, reimbursement/receipt gaps, budget
       pace signals, Kilo status when in scope, and review note path.

    Do not submit to ExpenseDesk or mutate Lunch Money categories/status unless the
    user explicitly approved a correction during the review.

    Rate limit: wait 0.3s between Lunch Money API calls.
  # The live Jul 12 review reached the former 600s ceiling. The review now
  # records seven checkpoints, so preserve partial state and allow 15 minutes.
  timeout_seconds: 900

provider:
  model: role:job-finance-review

delivery:
  mode: none

completion:
  workflow_id: weekly-finance-review
  scope: weekly
  # The finance-review state completion gate is authoritative. A returned
  # agent turn is not enough to suppress a same-week retry.
  check_before_run: false
  mark_on_success: false

policy:
  max_consecutive_failures: 3
  alert_channel_id: "100000000000000010"
  concurrency_group: ledger-tasks
  priority: 5
  backoff:
    enabled: true
    initial_seconds: 120
    max_seconds: 3600

tags:
  - foxtrot
  - finance
  - rolling-review
