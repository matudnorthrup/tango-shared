id: echo
enabled: false
# Isolated: serves a family member, not the owner. No built-in tools, no
# shared memory/state, strictly self-scoped memory, safe MCP tools only.
# See docs/guides/isolated-agents.md.
isolated: true
display_name: Echo
type: youth-quick

system_prompt_file: agents/assistants/echo/soul.md

mcp_servers:
  - name: youth-tools
    command: node
    args: ["packages/core/dist/mcp-proxy.js", "youth-tools"]
    env:
      ALLOWED_TOOL_IDS: "exa_search,exa_answer,safety_alert"

runtime:
  mode: persistent
  provider: claude-code-v2
  model: claude-opus-5-5
  reasoning_effort: low
  idle_timeout_hours: 24
  context_reset_threshold: 0.80
  timeout_seconds: 300

memory:
  post_turn_extraction: disabled
  canonical_agent_id: echo
  extraction_model: role:memory-extraction
  importance_threshold: 0.9
  scheduled_reflection: disabled

# Real channel ids, enabled: true, and the access allowlist (channels plus the
# family member's and owner's Discord user ids) come from the profile overlay.
discord:
  default_channel_id: "100000000000000031"
  smoke_test_channel_id: "100000000000001031"

default_project: personal
response_mode: concise

provider:
  default: claude-oauth
  reasoning_effort: low
  # Never codex: degraded Codex hops run a CLI with filesystem access.
  fallback:
    - claude-oauth-secondary
    - ollama

tools:
  mode: off

deterministic_routing:
  enabled: false
